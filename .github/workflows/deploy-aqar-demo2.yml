name: Deploy aqar-demo2.novixa.dev (ui-improves)

# Pushing to ui-improves deploys https://aqar-demo2.novixa.dev on the Novixa
# VPS — a separate demo (own database, containers and secrets) next to
# aqar-demo.novixa.dev (main). See deploy/aqar-demo/README.md.

on:
  push:
    branches: [ui-improves]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Emergency deploy without running the test suite'
        type: boolean
        default: false

# One deploy at a time; a newer push waits rather than cancelling a release
# that is halfway through.
concurrency:
  group: deploy-aqar-demo2
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/novixa-dev/novixa-aqar
  DEPLOY_HOST: 161.97.75.64
  DEPLOY_USER: aqar
  SITE: aqar-demo2
  SITE_URL: https://aqar-demo2.novixa.dev

jobs:
  test:
    name: Test suite
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_tests) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo, pdo_sqlite, bcmath, zip, gd, intl
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test --no-ansi

  build:
    name: Build image
    needs: test
    # Runs after a green test job, or alone when tests were explicitly skipped.
    if: ${{ always() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ env.IMAGE }}:sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # The Filament theme CSS imports from vendor/filament, so PHP packages
      # must be present before Vite runs. (The image installs its own vendor;
      # this copy only feeds the asset build and is excluded from the image.)
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, bcmath, zip, gd, intl
          coverage: none

      - name: Install PHP packages for the asset build
        run: composer install --no-dev --no-interaction --prefer-dist --no-scripts --no-autoloader

      # Fresh frontend assets, so the image never ships a stale committed
      # public/build.
      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:aqar-demo2
          # Overrides the Dockerfile's upstream LABELs so GHCR links the
          # package to this repository (and GITHUB_TOKEN may push to it).
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=novixa-aqar
          cache-from: type=gha,scope=aqar-demo2
          cache-to: type=gha,scope=aqar-demo2,mode=max

  deploy:
    name: Deploy to aqar-demo2.novixa.dev
    needs: build
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: aqar-demo2
      url: https://aqar-demo2.novixa.dev
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Check deploy secrets
        env:
          KEY: ${{ secrets.AQAR_DEMO_SSH_KEY }}
          KNOWN: ${{ secrets.AQAR_DEMO_KNOWN_HOSTS }}
        run: |
          if [ -z "$KEY" ] || [ -z "$KNOWN" ]; then
            echo "::error::Add the AQAR_DEMO_SSH_KEY and AQAR_DEMO_KNOWN_HOSTS repository secrets (see deploy/aqar-demo/README.md)."
            exit 1
          fi

      - name: Configure SSH
        env:
          KEY: ${{ secrets.AQAR_DEMO_SSH_KEY }}
          KNOWN: ${{ secrets.AQAR_DEMO_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/aqar_demo
          chmod 600 ~/.ssh/aqar_demo
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host aqar-demo
            HostName ${DEPLOY_HOST}
            User ${DEPLOY_USER}
            IdentityFile ~/.ssh/aqar_demo
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 15
          EOF

      - name: Upload deploy files
        run: |
          # Shared kit from deploy/aqar-demo/, site config from deploy/$SITE/.
          scp -q deploy/aqar-demo/compose.yml deploy/aqar-demo/nginx.conf \
                 deploy/aqar-demo/deploy.sh "deploy/$SITE/app.env" \
                 "aqar-demo:/opt/$SITE/"
          ssh aqar-demo "chmod 750 /opt/$SITE/deploy.sh"

      - name: Release
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          IMAGE_REF: ${{ needs.build.outputs.image }}
        run: |
          # The registry login lives only for this release: the job token
          # expires when the job ends, and it is removed from the server
          # straight after.
          # Per-site DOCKER_CONFIG (deploy.sh uses the same path), so two
          # sites deploying at once never log each other out.
          DC="DOCKER_CONFIG=/opt/$SITE/.docker"
          printf '%s' "$TOKEN" | ssh aqar-demo "$DC docker login ghcr.io -u '$ACTOR' --password-stdin >/dev/null"
          set +e
          ssh aqar-demo "/opt/$SITE/deploy.sh '$IMAGE_REF'"
          status=$?
          ssh aqar-demo "$DC docker logout ghcr.io >/dev/null" || true
          exit $status

      - name: Verify through Cloudflare
        run: |
          for path in / /admin/login; do
            code=000
            for attempt in 1 2 3 4 5; do
              code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$SITE_URL$path" || echo 000)"
              [ "$code" = 200 ] && break
              sleep 5
            done
            echo "$SITE_URL$path -> $code"
            case "$code" in
              200) ;;
              # Cloudflare bot protection may challenge GitHub's runner IPs;
              # the origin itself was already verified by deploy.sh.
              403|503) echo "::warning::$path returned $code from Cloudflare (likely a bot challenge for runner IPs)";;
              *) echo "::error::$path returned $code"; exit 1;;
            esac
          done
