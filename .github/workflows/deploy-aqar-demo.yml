name: Deploy aqar-demo.novixa.dev

# Pushing to main deploys https://aqar-demo.novixa.dev on the Novixa VPS.
# Independent of the Dexal (cPanel) pipeline — see deploy/aqar-demo/README.md.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Emergency deploy without running the test suite'
        type: boolean
        default: false

# One deploy at a time; a newer push waits rather than cancelling a release
# that is halfway through.
concurrency:
  group: deploy-aqar-demo
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: novixa-aqar
  DEPLOY_HOST: 161.97.75.64
  DEPLOY_USER: aqar
  SITE: aqar-demo
  SITE_URL: https://aqar-demo.novixa.dev

jobs:
  test:
    name: Test suite
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_tests) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo, pdo_sqlite, bcmath, zip, gd, intl
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test --no-ansi

  deploy:
    name: Build and deploy
    needs: test
    # Runs after a green test job, or alone when tests were explicitly skipped.
    if: ${{ always() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: aqar-demo
      url: https://aqar-demo.novixa.dev
    steps:
      # Secrets first: a misconfigured secret fails in seconds with a clear
      # message instead of after a 10-minute build.
      - name: Check deploy secrets
        env:
          KEY: ${{ secrets.AQAR_DEMO_SSH_KEY }}
          KNOWN: ${{ secrets.AQAR_DEMO_KNOWN_HOSTS }}
        run: |
          fail=0
          if [ -z "$KEY" ]; then
            echo "::error::Secret AQAR_DEMO_SSH_KEY is missing."; fail=1
          elif ! printf '%s\n' "$KEY" | grep -q -- '-----BEGIN OPENSSH PRIVATE KEY-----'; then
            echo "::error::AQAR_DEMO_SSH_KEY must be the whole private key file, from -----BEGIN OPENSSH PRIVATE KEY----- to -----END OPENSSH PRIVATE KEY-----."; fail=1
          fi
          if [ -z "$KNOWN" ]; then
            echo "::error::Secret AQAR_DEMO_KNOWN_HOSTS is missing."; fail=1
          elif ! printf '%s\n' "$KNOWN" | grep -q "^${DEPLOY_HOST} ssh-ed25519 "; then
            echo "::error::AQAR_DEMO_KNOWN_HOSTS must be the line starting with '${DEPLOY_HOST} ssh-ed25519 ' (see deploy/aqar-demo/README.md)."; fail=1
          fi
          exit $fail

      - name: Configure SSH
        env:
          KEY: ${{ secrets.AQAR_DEMO_SSH_KEY }}
          KNOWN: ${{ secrets.AQAR_DEMO_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          # tr: a key pasted from Windows carries CRLF line endings, which
          # OpenSSH rejects as "invalid format".
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/aqar_demo
          chmod 600 ~/.ssh/aqar_demo
          printf '%s\n' "$KNOWN" | tr -d '\r' > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host aqar-demo
            HostName ${DEPLOY_HOST}
            User ${DEPLOY_USER}
            IdentityFile ~/.ssh/aqar_demo
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 15
          EOF
          ssh aqar-demo true && echo "SSH to ${DEPLOY_USER}@${DEPLOY_HOST} OK"

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # The Filament theme CSS imports from vendor/filament, so PHP packages
      # must be present before Vite runs. (The image installs its own vendor;
      # this copy only feeds the asset build and is excluded from the image.)
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, bcmath, zip, gd, intl, sockets
          coverage: none

      - name: Install PHP packages for the asset build
        run: composer install --no-dev --no-interaction --prefer-dist --no-scripts --no-autoloader

      # Fresh frontend assets, so the image never ships a stale committed
      # public/build.
      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ env.SITE }}
          cache-to: type=gha,scope=${{ env.SITE }},mode=max

      # Straight to the server — no container registry, so no package
      # permissions and no registry credentials on the VPS.
      - name: Ship image to the server
        run: |
          docker save "$IMAGE:sha-$GITHUB_SHA" | gzip -1 | ssh aqar-demo 'gunzip | docker load'

      - name: Upload deploy files
        run: |
          # Shared kit from deploy/aqar-demo/, site config from deploy/$SITE/.
          scp -q deploy/aqar-demo/compose.yml deploy/aqar-demo/nginx.conf \
                 deploy/aqar-demo/deploy.sh "deploy/$SITE/app.env" \
                 "aqar-demo:/opt/$SITE/"
          ssh aqar-demo "chmod 750 /opt/$SITE/deploy.sh"

      - name: Release
        run: ssh aqar-demo "/opt/$SITE/deploy.sh '$IMAGE:sha-$GITHUB_SHA'"

      - name: Verify through Cloudflare
        run: |
          for path in / /admin/login; do
            code=000
            for _ in 1 2 3 4 5; do
              code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$SITE_URL$path" || echo 000)"
              [ "$code" = 200 ] && break
              sleep 5
            done
            echo "$SITE_URL$path -> $code"
            case "$code" in
              200) ;;
              # Cloudflare bot protection may challenge GitHub's runner IPs;
              # the origin itself was already verified by deploy.sh.
              403|503) echo "::warning::$path returned $code from Cloudflare (likely a bot challenge for runner IPs)";;
              *) echo "::error::$path returned $code"; exit 1;;
            esac
          done
