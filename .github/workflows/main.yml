name: Docker

on:
  push:
    branches: [main]
  # ui-improves (aqar-demo2) is a long-lived release branch too: PRs into it
  # were never tested before merge, only by the deploy's own test step.
  pull_request:
    branches: [main, ui-improves]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  laravel-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo, pdo_sqlite, bcmath, opcache, zip, gd, intl
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Copy environment file
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate application key
        run: php artisan key:generate

      - name: Run tests
        run: ./vendor/bin/phpunit --no-coverage

  docker:
    if: github.event_name == 'push'
    needs: laravel-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    # Secrets can't be read in a job-level `if`, so expose their presence
    # here. Without Docker Hub credentials the login step used to fail on
    # every push to main, a permanent red check unrelated to the real
    # deploys (deploy-aqar-demo*.yml build and ship their own image).
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}

    steps:
      - name: Skip notice (no Docker Hub credentials)
        if: env.HAS_DOCKERHUB != 'true'
        run: echo "::notice title=Docker Hub publish skipped::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN are not configured; demo deploys build their own image."

      - name: Checkout code
        if: env.HAS_DOCKERHUB == 'true'
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata for Docker
        if: env.HAS_DOCKERHUB == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: novixa/aqar
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=novixa/aqar:buildcache
          cache-to: type=registry,ref=novixa/aqar:buildcache,mode=max
