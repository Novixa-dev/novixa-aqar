<!doctype html><html dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;font-family:Cairo,sans-serif;color:#fff;
 background:radial-gradient(900px 520px at 90% -10%,#8a7565 0%,transparent 60%),radial-gradient(700px 420px at 0% 110%,#5b4a3f 0%,transparent 60%),linear-gradient(135deg,#1c1816,#2b2420 60%,#3a302a);position:relative}
.line{position:absolute;inset:40px;border:1px solid rgba(214,196,180,.22);border-radius:28px}
.wrap{position:absolute;inset:80px 90px;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;align-items:center;gap:26px}
.logo{width:104px;height:104px;border-radius:26px;background:#8a7565;display:flex;align-items:center;justify-content:center;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.logo svg{width:58px;height:58px}
h1{font-size:78px;font-weight:900;line-height:1;letter-spacing:4px}
.en{font-family:Outfit,sans-serif;font-size:34px;font-weight:700;letter-spacing:8px;color:#d6c4b4;direction:ltr;text-align:right;margin-top:6px}
.tag{font-size:46px;font-weight:800;line-height:1.35}
.tag small{display:block;font-family:Outfit,sans-serif;direction:ltr;text-align:right;font-size:28px;font-weight:600;color:#d6c4b4;margin-top:10px}
.bottom{display:flex;justify-content:space-between;align-items:center;font-size:24px;color:#d6c4b4;font-weight:700}
.chips{display:flex;gap:12px}.chip{padding:8px 20px;border-radius:999px;background:rgba(214,196,180,.12);border:1px solid rgba(214,196,180,.3);color:#fff}
</style></head><body><div class="line"></div><div class="wrap">
<div class="top"><div class="logo"><svg fill="none" stroke="#fff" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg></div><div><h1>رسو العقارية</h1><div class="en">RUSU REAL ESTATE</div></div></div>
<div class="tag">نصنع الفخامة في كل تفصيلة<small>Crafting Luxury in Every Detail</small></div>
<div class="bottom"><div class="chips"><div class="chip">سكن فاخر</div><div class="chip">استثمار موثوق</div></div><div style="font-family:Outfit;direction:ltr">aqar-demo2.novixa.dev</div></div>
</div></body></html>
