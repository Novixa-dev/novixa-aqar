<!doctype html><html dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;font-family:Cairo,sans-serif;color:#fff;
 background:radial-gradient(1200px 600px at 85% -10%,#3b82f6 0%,transparent 60%),radial-gradient(900px 500px at 0% 110%,#4f46e5 0%,transparent 55%),linear-gradient(135deg,#0b1d4f,#1e3a8a 55%,#1d4ed8);
 position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:48px 48px}
.wrap{position:absolute;inset:72px 80px;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;align-items:center;gap:28px}
.logo{width:116px;height:116px;border-radius:30px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.logo img{width:84px;height:84px}
h1{font-size:76px;font-weight:900;line-height:1.05}
.en{font-family:Outfit,sans-serif;font-size:40px;font-weight:700;opacity:.9;direction:ltr;text-align:right}
.tag{font-size:40px;font-weight:800;line-height:1.35;max-width:980px}
.tag span{color:#93c5fd}
.bottom{display:flex;justify-content:space-between;align-items:center}
.chips{display:flex;gap:14px}
.chip{font-size:24px;font-weight:700;padding:10px 22px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25)}
.url{font-family:Outfit,sans-serif;font-size:30px;font-weight:700;direction:ltr;opacity:.95}
</style></head><body><div class="grid"></div>
<div class="wrap">
 <div class="top"><div class="logo"><img src="../../public/images/logo.svg"></div><div><h1>نوفيكسا عقار</h1><div class="en">Novixa Aqar</div></div></div>
 <div class="tag">منصة عقارية متكاملة للبيع والإيجار في اليمن — <span>بحث، معاينات، عقود، صيانة</span> ولوحة لكل دور.</div>
 <div class="bottom"><div class="chips"><div class="chip">بيع</div><div class="chip">إيجار</div><div class="chip">إدارة أملاك</div></div><div class="url">novixa.dev</div></div>
</div></body></html>
