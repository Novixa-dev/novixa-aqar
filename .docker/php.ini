[PHP]
post_max_size = 420M
upload_max_filesize = 400M
expose_php = 0
realpath_cache_size = 32M
realpath_cache_ttl = 720
memory_limit = 256M
max_input_time = 5
register_argc_argv = 0
date.timezone = ${TZ:-UTC}

[Opcache]
; Disabled entirely (previously enabled with a lowered 128M budget + JIT
; off). Deploy logs after that change showed the octane server process
; being SIGKILLed roughly once per second, in a tightening loop, with
; memory usage climbing to exactly the container's 1GB ceiling each time.
; Opcache's shared-memory segment is not guaranteed to be released when a
; process is killed with SIGKILL rather than shutting down cleanly -- on a
; host where the process keeps getting killed, that is exactly the
; scenario where a segment can be leaked instead of freed, and the next
; process either fails to reuse it cleanly or ends up accumulating memory
; alongside it. Disabling opcache removes that whole failure mode. The
; cost is that PHP recompiles from source on every request instead of
; reusing cached bytecode -- a fully acceptable trade for a low-traffic
; demo/staging deployment, in exchange for a predictable memory footprint
; instead of a crash loop.
opcache.enable = 0
opcache.enable_cli = 0

[JIT]
; JIT requires opcache; disabled along with it above.
opcache.jit = off
