[PHP]
post_max_size = 420M
upload_max_filesize = 400M
expose_php = 0
realpath_cache_size = 32M
realpath_cache_ttl = 720
memory_limit = 256M
max_input_time = 5
register_argc_argv = 0
date.timezone = ${TZ:-UTC}

[Opcache]
; Re-enabled, conservatively, now that the condition that justified
; turning it off no longer exists.
;
; It was disabled during the OOM incident: Octane was running two workers
; against a 1GB ceiling, memory sat at 100%, and the server process was
; being SIGKILLed roughly once per second. Opcache's shared-memory segment
; is not guaranteed to be released on SIGKILL rather than a clean
; shutdown, so in a tight crash loop it could plausibly leak instead of
; free -- disabling it removed that whole failure mode while the real root
; cause (worker count) was being found.
;
; That root cause is fixed: workers are pinned to 1 and measured memory
; now sits at ~0.15GB of the 1GB limit, flat, with no crash loop for days.
; There is no longer a repeated-SIGKILL scenario for a segment to leak
; across. Meanwhile the cost of leaving it off is real and user-visible:
; PHP recompiles every file on every request, which for a Filament app
; with ~103 models across 9 panels is exactly why the QA guide has to warn
; that the first page load is slow.
;
; Sized deliberately small: 64M of shared bytecode plus an 8M interned
; string buffer is a single ~72M shared allocation (not per-worker), well
; inside the ~850M of current headroom.
opcache.enable = 1
; CLI stays off on purpose. CLI runs here are short-lived one-shots
; (migrations, seeders, artisan optimize) that gain nothing from a cache
; discarded when the process exits -- and with validate_timestamps=0
; below, caching them would risk an artisan command running stale code.
opcache.enable_cli = 0
opcache.memory_consumption = 64
; Filament + Laravel is a large file count; too low a cap makes opcache
; thrash and evict, which is worse than not caching at all.
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 8
; The image is immutable and rebuilt per deploy, so source files can never
; change under a running container -- skip the per-request stat() calls.
opcache.validate_timestamps = 0
; Deliberately NOT setting opcache.file_cache: the previous config's
; file_cache path is what fatally errored on every PHP invocation when the
; directory didn't exist on a fresh container. Pure shared memory has no
; such dependency, and the container is short-lived enough that persisting
; compiled code to disk buys little.

[JIT]
; Still off. JIT reserves its own separate buffer and buys little for an
; I/O-bound CRUD app (database queries and template rendering dominate),
; which is not a trade worth making on a memory-constrained host.
opcache.jit_buffer_size = 0
opcache.jit = off
