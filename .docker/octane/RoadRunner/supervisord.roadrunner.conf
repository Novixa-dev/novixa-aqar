[program:octane]
process_name = %(program_name)s_%(process_num)s
; --workers=1: this host's container has a 1GB memory limit, and the
; default (one worker per CPU core = 2 here) left two full copies of the
; booted app in memory plus Octane overhead, right at the ceiling and
; getting OOM-killed. One persistent worker is plenty for demo traffic.
command = php %(ENV_ROOT)s/artisan octane:roadrunner --host=0.0.0.0 --port=8000 --rpc-port=6001 --workers=1 --rr-config=%(ENV_ROOT)s/.rr.yaml
user = %(ENV_USER)s
priority = 1
autostart = true
autorestart = true
stopasgroup = true
killasgroup = true
environment = LARAVEL_OCTANE = "1"
stdout_logfile = /var/log/supervisor/octane.out.log
stdout_logfile_maxbytes = 5MB
stderr_logfile = /var/log/supervisor/octane.err.log
stderr_logfile_maxbytes = 5MB

[include]
files = /etc/supervisor/supervisord.conf
