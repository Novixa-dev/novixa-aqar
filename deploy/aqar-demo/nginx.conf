# ==============================================================================
# <site>.novixa.dev — site block template for mailcow's nginx.
#
# MANAGED BY CI: deploy/aqar-demo/deploy.sh renders __SITE__ (aqar-demo,
# aqar-demo2, …) and installs it to <mailcow>/data/conf/nginx/<site>.conf on
# every release. Edit it in the repository, not
# on the server. deploy.sh runs `nginx -t` before every reload and restores
# the previous file if the test fails, so a bad edit can never take down
# mailcow's nginx (and with it webmail and novixa.dev).
#
# Only answers for its own host; mailcow's own hostnames and
# novixa.conf are untouched.
# ==============================================================================

server {
    listen 80;
    server_name __SITE__.novixa.dev;
    return 301 https://__SITE__.novixa.dev$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name __SITE__.novixa.dev;

    # Cloudflare Origin Certificate (*.novixa.dev) — a copy owned by this
    # site, so it does not depend on novixa.conf's files.
    ssl_certificate     /etc/nginx/conf.d/__SITE__/origin.pem;
    ssl_certificate_key /etc/nginx/conf.d/__SITE__/origin.key;

    # Real visitor IP, believed only from Cloudflare's published ranges.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Property photos and documents. Cloudflare's free plan caps request
    # bodies at 100 MB anyway.
    client_max_body_size 100m;

    location / {
        # Resolved per request through Docker's DNS, so mailcow's nginx still
        # starts when the app is down (this block answers 502 instead). The
        # short TTL is what lets deploy.sh drain the old release in seconds.
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $aqar_app http://__SITE__-app:8000;
        proxy_pass $aqar_app;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_buffer_size 32k;
        proxy_buffers 16 32k;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
